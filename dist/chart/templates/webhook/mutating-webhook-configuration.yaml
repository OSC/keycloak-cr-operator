{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "keycloak-cr-operator.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    {{- end }}
  name: {{ include "keycloak-cr-operator.resourceName" (dict "suffix" "mutating-webhook-configuration" "context" $) }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-keycloak-osc-edu-v1alpha1-keycloakclient
      port: 9443
  failurePolicy: Fail
  name: mkeycloakclient-v1alpha1.kb.io
  rules:
  - apiGroups:
    - keycloak.osc.edu
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - keycloakclients
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-keycloak-osc-edu-v1alpha2-keycloakclient
      port: 9443
  failurePolicy: Fail
  name: mkeycloakclient-v1alpha2.kb.io
  rules:
  - apiGroups:
    - keycloak.osc.edu
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - keycloakclients
  sideEffects: None
{{- end }}
