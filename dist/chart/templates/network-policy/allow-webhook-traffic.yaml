{{- if and .Values.networkPolicy.enabled .Values.webhook.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "keycloak-cr-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "keycloak-cr-operator.resourceName" (dict "suffix" "allow-webhook-traffic" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          tier: control-plane
    ports:
    - port: {{ .Values.webhook.port }}
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "keycloak-cr-operator.name" . }}
      control-plane: controller-manager
  policyTypes:
  - Ingress
{{- end }}
