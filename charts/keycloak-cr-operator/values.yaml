# -- String to partially override chart.fullname template (will maintain the release name)
nameOverride: ""

# -- String to fully override chart.fullname template
fullnameOverride: ""

manager:
  # -- Set to false to skip manager installation
  enabled: true

  # -- Number of manager replicas
  replicas: 1

  image:
    # -- Image registry
    registry: quay.io
    # -- Manager image repository
    repository: ohiosupercomputercenter/keycloak-cr-operator
    # -- Manager image tag
    # @default -- The chart's app version
    tag: ""
    # -- Manager image pull policy
    pullPolicy: IfNotPresent

  config:
    # -- Keycloak server URL, eg: https://keycloak.example.com.
    # **required**
    keycloakURL: ""
    # -- Keycloak admin username
    adminUsername: admin
    # -- Keycloak admin password.
    # **required**
    adminPassword: ""
    # -- Keycloak admin realm
    adminRealm: master
    # -- Default Keycloak realm for new resources
    defaultRealm:
    # -- Realms that can be used for custom resources
    allowedRealms: []
    # -- Prefix for generated client IDs
    clientIdPrefix: kubernetes
    # -- Required ClientID template
    clientIdRequired: ""

  # @ignored
  args:
    - --leader-elect
  # -- Extra arguments to pass to the manager
  extraArgs: []

  # -- Annotations to add to manager Deployment
  annotations: {}
  # -- Custom Deployment labels
  labels: {}
  # -- Pod annotations to add to manager pods
  podAnnotations:
    kubectl.kubernetes.io/default-container: manager
  # -- Pod labels to add to manager pods
  podLabels: {}

  # -- Health check port
  healthPort: 8081

  # -- Environment variables to add to manager pods
  env: []

  # -- Use the imagePullSecret resource created by this chart
  useImagePullSecret: false
  # -- imagePullSecrets to use for existing secrets
  imagePullSecrets: []

  # -- Pod-level security settings
  # @default -- unprivileged
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security settings
  # @default -- unprivileged
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534

  # Resource limits and requests
  resources:
    limits:
      # -- CPU limit
      cpu: 1
      # -- Memory limit
      memory: 256Mi
    requests:
      # -- CPU request
      cpu: 100m
      # -- Memory request
      memory: 64Mi

  # -- Manager pod's affinity
  affinity: {}

  # -- Manager pod's node selector
  nodeSelector: {}

  # -- Manager pod's tolerations
  tolerations: []

  # -- Deployment strategy
  # @default -- RollingUpdate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  # -- Priority class name
  priorityClassName: ""

  # -- Topology spread constraints
  topologySpreadConstraints: []

  # -- Termination grace period seconds
  terminationGracePeriodSeconds: 10

# RBAC configuration
rbac:
  # -- RBAC resource scope
  # - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  # - true: Role/RoleBinding (release namespace only)
  namespaced: false

  # -- Helper roles for CRD management (admin/editor/viewer)
  helpers:
    # -- Install convenience admin/editor/viewer roles for CRDs
    enabled: false

# ServiceAccount configuration
serviceAccount:
  # -- Install default ServiceAccount provided
  enabled: true

  # -- Existing ServiceAccount name (only when enabled=false)
  # Note: When enabled=true, respects nameOverride/fullnameOverride
  name: ""

  # -- Custom ServiceAccount annotations
  annotations: {}

  # -- Custom ServiceAccount labels
  labels: {}

# Custom Resource Definitions
crd:
  # -- Install CRDs with the chart
  enabled: true
  # -- Keep CRDs when uninstalling
  keep: true

# Controller metrics endpoint
metrics:
  # -- Enable to expose /metrics endpoint with RBAC protection
  enabled: true
  # -- Metrics protocol (http or https)
  protocol: https
  # -- Metrics server ports.  Only supports http and https keys
  ports:
    # -- HTTP port
    http: 8080
    # -- HTTPS port
    https: 8443
  # -- Annotations to add to metrics endpoint
  annotations: {}

# Cert-manager integration for TLS certificates
certManager:
  # -- Enable cert-manager integration.
  # Required for webhook certificates and metrics endpoint certificates
  enabled: true

# Webhook server configuration
webhook:
  # -- Enable webhook server
  enabled: true
  # -- Webhook server port
  port: 9443
  # -- Annotations to add to webhook server
  annotations: {}

# Prometheus ServiceMonitor for metrics scraping
prometheus:
  # -- Enable Prometheus ServiceMonitor.
  # Requires prometheus-operator to be installed in the cluster
  enabled: false

networkPolicy:
  # -- Enable NetworkPolicy resources for this operator
  enabled: true
  # -- Allow all pods in operator's namespace to access the operator's metrics
  allowMetricsFromPods: false
  # --  The Prometheus namespace to allow access
  prometheusLabels:
    app.kubernetes.io/name: prometheus
  # -- The API server namespace name
  apiServerNamespace: kube-system
  # -- The API server pod labels to allow
  apiServerPodLabels:
    tier: control-plane

imagePullSecret:
  # -- Create the image pull secret
  create: false
  # -- imagePullSecret registry
  registry: ""
  # -- imagePullSecret username
  username: ""
  # -- imagePullSecret password
  password: ""

hooks:
  # -- Enable post-install hooks
  enabled: true
  image:
    # -- hook image registry
    registry: docker.io
    # -- hook image repository
    repository: portainer/kubectl-shell
    # -- hook image tag
    tag: '2.39.0'
    # -- hook image pull policy
    pullPolicy: IfNotPresent
  # -- Use the imagePullSecret resource created by this chart
  useImagePullSecret: false
  # -- imagePullSecrets to use for existing secrets
  imagePullSecrets: []
  # -- Job labels to add to the hook job
  jobLabels: {}
  # -- Pod labels to add to the hook pod
  podLabels: {}
  # -- Pod annotations to add to the hook pod
  podAnnotations: {}
  # -- Pod-level security settings
  # @default -- unprivileged
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # -- Security context for the hook pod
  # @default -- unprivileged
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
