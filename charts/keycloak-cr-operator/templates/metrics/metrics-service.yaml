{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- with .Values.metrics.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "keycloak-cr-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
  name: {{ include "keycloak-cr-operator.resourceName" (dict "suffix" "metrics-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    port: {{ .Values.metrics.port }}
    protocol: TCP
    targetPort: {{ .Values.metrics.port }}
  selector:
    {{- include "keycloak-cr-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
