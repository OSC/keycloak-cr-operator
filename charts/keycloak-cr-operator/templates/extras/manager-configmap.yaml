apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "keycloak-cr-operator.labels" . | nindent 4 }}
  name: {{ include "keycloak-cr-operator.resourceName" (dict "suffix" "manager-config" "context" $) }}
  namespace: {{ .Release.Namespace }}
data:
  CONFIG_KEYCLOAK_URL: {{ required "Keycloak URL is required" (tpl .Values.manager.config.keycloakURL .) | quote }}
{{- if .Values.manager.config.adminRealm }}
  CONFIG_KEYCLOAK_ADMIN_REALM: {{ .Values.manager.config.adminRealm | quote }}
{{- end }}
{{- if .Values.manager.config.defaultRealm }}
  CONFIG_KEYCLOAK_DEFAULT_REALM: {{ .Values.manager.config.defaultRealm | quote }}
{{- end }}
{{- if .Values.manager.config.allowedRealms }}
  CONFIG_KEYCLOAK_ALLOWED_REALMS: {{ .Values.manager.config.allowedRealms | join "," | quote }}
{{- end }}
{{- if .Values.manager.config.clientIdPrefix }}
  CONFIG_KEYCLOAK_CLIENT_ID_PREFIX: {{ .Values.manager.config.clientIdPrefix | quote }}
{{- end }}
{{- if .Values.manager.config.clientIdRequired }}
  CONFIG_KEYCLOAK_CLIENT_ID_REQUIRED: {{ .Values.manager.config.clientIdRequired | quote }}
{{- end }}
